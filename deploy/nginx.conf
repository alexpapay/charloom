# Install in nginx's http context (for example sites-available/charloom.conf).
# Issue a certificate before enabling the TLS server block.
limit_req_zone $binary_remote_addr zone=charloom_convert:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name charloom.popovich.one;
    location ^~ /.well-known/acme-challenge/ { root /var/www/charloom-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name charloom.popovich.one;
    ssl_certificate /etc/letsencrypt/live/charloom.popovich.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/charloom.popovich.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    client_body_timeout 20s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/ {
        limit_req zone=charloom_convert burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4175;
        proxy_request_buffering off;
        proxy_read_timeout 40s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:4175;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
