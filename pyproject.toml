[project]
name = "charloom"
version = "0.6.1"
description = "Weave pixels into expressive, responsive text art"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2,<3", "Pillow>=12.1.1,<13"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.urls]
Homepage = "https://charloom.popovich.one"
Repository = "https://github.com/alexpapay/charloom"
Issues = "https://github.com/alexpapay/charloom/issues"

[project.scripts]
ascii-gen = "ascii_gen.cli:main"
charloom = "ascii_gen.cli:main"
charloom-web = "ascii_gen.web:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ascii_gen"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
